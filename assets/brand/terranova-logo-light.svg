  <!-- variant voor een lichte achtergrond: embleem + woordmerk + slogan -->
  <defs><linearGradient id="tn-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <clipPath id="tn-c"><circle cx="48" cy="50" r="30"/></clipPath><clipPath id="tn-front"><rect x="-5" y="50" width="106" height="33" transform="rotate(-18 48 50)"/></clipPath></defs>
  <ellipse cx="48" cy="50" rx="43" ry="13" fill="none" stroke="#0f1b33" stroke-width="3.4" opacity=".55" transform="rotate(-18 48 50)"/><circle cx="48" cy="50" r="30" fill="url(#tn-g)"/>
