    <linearGradient id="tn-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <clipPath id="tn-c"><circle cx="32" cy="34" r="20"/></clipPath>
  <clipPath id="tn-front"><rect x="-7" y="34" width="78" height="29" transform="rotate(-18 32 34)"/></clipPath></defs>
  <ellipse cx="32" cy="34" rx="29" ry="9" fill="none" stroke="#e5e7eb" stroke-width="2.4" opacity=".55" transform="rotate(-18 32 34)"/><circle cx="32" cy="34" r="20" fill="url(#tn-g)"/>
  <g clip-path="url(#tn-c)" fill="#0b1220" opacity=".9">
    <rect x="15" y="30" width="6" height="30"/><rect x="22.5" y="22" width="6" height="38"/><rect x="30" y="14" width="5" height="46"/><rect x="36.5" y="25" width="6" height="35"/><rect x="44" y="31" width="5" height="29"/>
  </g>
  <g clip-path="url(#tn-c)" fill="#a7f3d0"><rect x="31.2" y="17" width="1.2" height="1.2"/><rect x="33" y="21" width="1.2" height="1.2"/><rect x="24" y="26" width="1.2" height="1.2"/><rect x="38" y="29" width="1.2" height="1.2"/></g>
  <path d="M12 34 q20 7 40 0" fill="none" stroke="#0b1220" stroke-width="2.2"/>
  <g clip-path="url(#tn-front)"><ellipse cx="32" cy="34" rx="29" ry="9" fill="none" stroke="#e5e7eb" stroke-width="2.4" transform="rotate(-18 32 34)"/></g>
  <circle cx="57.5" cy="24.8" r="3.2" fill="#10b981" stroke="#e5e7eb" stroke-width="1.6"/>
